<style>
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
:root {
  --bg: #FAF8F4;
  --bg-card: #FFFFFF;
  --bg-soft: #F2EFE8;
  --ink: #1A1A1A;
  --ink-soft: #5C5C5A;
  --ink-mute: #8E8C86;
  --line: rgba(26,26,26,0.08);
  --line-strong: rgba(26,26,26,0.16);
  --green: #4A7C2A;
  --green-bg: #E8F0DA;
  --amber: #B07914;
  --amber-bg: #FAEFD7;
  --red: #A02828;
  --red-bg: #FBE4E2;
  --accent: #1A1A1A;
  --shadow: 0 1px 2px rgba(26,26,26,0.04), 0 4px 12px rgba(26,26,26,0.03);
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #0E0E0C;
    --bg-card: #1A1A18;
    --bg-soft: #232320;
    --ink: #F4F1EA;
    --ink-soft: #B5B2AA;
    --ink-mute: #7A7872;
    --line: rgba(244,241,234,0.10);
    --line-strong: rgba(244,241,234,0.20);
    --green: #9BC470;
    --green-bg: #2A3A1C;
    --amber: #E0A845;
    --amber-bg: #3D2E12;
    --red: #E08585;
    --red-bg: #3D1F1F;
    --accent: #F4F1EA;
  }
}
html, body { background: var(--bg); color: var(--ink); font-family: 'Inter', -apple-system, sans-serif; -webkit-font-smoothing: antialiased; }
body { max-width: 480px; margin: 0 auto; min-height: 100vh; padding: env(safe-area-inset-top) 0 calc(env(safe-area-inset-bottom) + 80px); }

.header {
  padding: 20px 20px 16px;
  border-bottom: 0.5px solid var(--line);
  background: var(--bg);
  position: sticky;
  top: 0;
  z-index: 10;
  backdrop-filter: saturate(180%) blur(12px);
  -webkit-backdrop-filter: saturate(180%) blur(12px);
}
.header-row { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 4px; }
.brand { font-family: 'Fraunces', serif; font-weight: 400; font-size: 22px; letter-spacing: -0.01em; }
.brand em { font-style: italic; font-weight: 300; }
.update { font-size: 11px; color: var(--ink-mute); letter-spacing: 0.04em; text-transform: uppercase; }
.subtitle { font-size: 12px; color: var(--ink-soft); }

.stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 1px; background: var(--line); margin: 0; padding: 0; border-top: 0.5px solid var(--line); }
.stat { background: var(--bg); padding: 14px 16px; text-align: left; }
.stat-num { font-family: 'Fraunces', serif; font-size: 28px; font-weight: 400; line-height: 1; }
.stat-num.alert { color: var(--red); }
.stat-num.warn { color: var(--amber); }
.stat-num.ok { color: var(--green); }
.stat-label { font-size: 10px; color: var(--ink-mute); letter-spacing: 0.06em; text-transform: uppercase; margin-top: 4px; }

nav.tabs {
  display: flex;
  gap: 0;
  padding: 0;
  background: var(--bg);
  border-bottom: 0.5px solid var(--line);
  overflow-x: auto;
  scrollbar-width: none;
}
nav.tabs::-webkit-scrollbar { display: none; }
.tab {
  flex: 1;
  min-width: max-content;
  background: transparent;
  border: none;
  padding: 14px 16px;
  font-family: inherit;
  font-size: 13px;
  font-weight: 500;
  color: var(--ink-mute);
  cursor: pointer;
  position: relative;
  white-space: nowrap;
  transition: color 0.2s;
}
.tab.active { color: var(--ink); }
.tab.active::after {
  content: '';
  position: absolute;
  bottom: -0.5px;
  left: 16px;
  right: 16px;
  height: 2px;
  background: var(--ink);
}
.tab .badge {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  min-width: 18px;
  height: 18px;
  padding: 0 5px;
  font-size: 10px;
  font-weight: 600;
  background: var(--red-bg);
  color: var(--red);
  border-radius: 9px;
  margin-left: 4px;
}

.content { padding: 16px 20px; }
.panel { display: none; }
.panel.active { display: block; animation: fadeIn 0.25s ease; }
@keyframes fadeIn { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: translateY(0); } }

.section-head {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  margin: 24px 0 10px;
}
.section-head:first-child { margin-top: 4px; }
.section-title { font-family: 'Fraunces', serif; font-size: 14px; font-weight: 500; letter-spacing: 0.02em; text-transform: uppercase; }
.section-count { font-size: 11px; color: var(--ink-mute); font-variant-numeric: tabular-nums; }

.card {
  background: var(--bg-card);
  border: 0.5px solid var(--line);
  border-radius: 14px;
  margin-bottom: 8px;
  overflow: hidden;
  transition: border-color 0.2s;
  box-shadow: var(--shadow);
}
.card:active { border-color: var(--line-strong); }
.card.open { border-color: var(--line-strong); }
.card-head {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 14px 16px;
  cursor: pointer;
  user-select: none;
}
.dot {
  width: 8px;
  height: 8px;
  border-radius: 50%;
  flex-shrink: 0;
}
.dot.green { background: var(--green); box-shadow: 0 0 0 3px var(--green-bg); }
.dot.amber { background: var(--amber); box-shadow: 0 0 0 3px var(--amber-bg); }
.dot.red { background: var(--red); box-shadow: 0 0 0 3px var(--red-bg); }
.card-name {
  flex: 1;
  font-size: 15px;
  font-weight: 500;
  letter-spacing: -0.01em;
}
.staffing {
  font-size: 10px;
  color: var(--ink-soft);
  background: var(--bg-soft);
  padding: 3px 7px;
  border-radius: 6px;
  letter-spacing: 0.03em;
  font-weight: 500;
}
.chevron {
  width: 10px;
  height: 10px;
  border-right: 1.5px solid var(--ink-mute);
  border-bottom: 1.5px solid var(--ink-mute);
  transform: rotate(45deg);
  margin-left: 2px;
  margin-bottom: 4px;
  transition: transform 0.25s ease;
}
.card.open .chevron { transform: rotate(-135deg); margin-bottom: -4px; }

.card-meta {
  padding: 0 16px 12px 34px;
  font-size: 12px;
  color: var(--ink-soft);
  display: flex;
  align-items: center;
  gap: 6px;
}
.card-meta .date {
  color: var(--ink);
  font-weight: 500;
  font-variant-numeric: tabular-nums;
}

.card-body {
  max-height: 0;
  overflow: hidden;
  transition: max-height 0.3s ease;
}
.card.open .card-body { max-height: 800px; }
.card-body-inner {
  padding: 0 16px 16px 34px;
  border-top: 0.5px solid var(--line);
  margin-top: 0;
  padding-top: 14px;
}
.block { margin-bottom: 14px; }
.block:last-child { margin-bottom: 0; }
.block-label {
  font-size: 10px;
  color: var(--ink-mute);
  letter-spacing: 0.08em;
  text-transform: uppercase;
  margin-bottom: 6px;
  font-weight: 600;
}
.list { list-style: none; }
.list li {
  font-size: 13px;
  line-height: 1.55;
  color: var(--ink);
  padding: 4px 0 4px 14px;
  position: relative;
}
.list li::before {
  content: '';
  position: absolute;
  left: 0;
  top: 12px;
  width: 5px;
  height: 1px;
  background: var(--ink-mute);
}
.list.dates li { padding-left: 0; }
.list.dates li::before { display: none; }
.list.dates li {
  display: flex;
  gap: 10px;
  padding: 4px 0;
}
.list.dates .date {
  font-weight: 500;
  color: var(--ink);
  font-variant-numeric: tabular-nums;
  min-width: 60px;
  font-size: 12px;
}
.list.dates .label { font-size: 13px; color: var(--ink-soft); flex: 1; }

.arb-inline {
  background: var(--amber-bg);
  border-radius: 8px;
  padding: 8px 10px;
  font-size: 12px;
  color: var(--amber);
  line-height: 1.45;
  font-weight: 500;
}

/* Meetings */
.meeting-card {
  background: var(--bg-card);
  border: 0.5px solid var(--line);
  border-radius: 14px;
  padding: 16px;
  margin-bottom: 12px;
  box-shadow: var(--shadow);
}
.meeting-card.featured { border-color: var(--ink); }
.meeting-head {
  display: flex;
  align-items: baseline;
  gap: 10px;
  margin-bottom: 12px;
  padding-bottom: 10px;
  border-bottom: 0.5px solid var(--line);

.meeting-date-badge {
  font-family: 'Fraunces', serif;
  font-size: 20px;
  font-weight: 500;
  letter-spacing: -0.01em;
  line-height: 1;
}
.meeting-title-text {
  font-size: 13px;
  color: var(--ink-soft);
  flex: 1;
}
.agenda-item {
  padding: 10px 0;
  border-bottom: 0.5px solid var(--line);
}
.agenda-item:last-child { border-bottom: none; padding-bottom: 0; }
.agenda-item:first-child { padding-top: 0; }
.agenda-row { display: flex; align-items: flex-start; gap: 10px; }
.agenda-time {
  font-size: 11px;
  color: var(--ink-mute);
  font-variant-numeric: tabular-nums;
  min-width: 60px;
  padding-top: 1px;
  letter-spacing: 0.02em;
}
.agenda-body { flex: 1; }
.agenda-topic {
  font-size: 13px;
  font-weight: 500;
  line-height: 1.4;
  color: var(--ink);
}
.agenda-owners {
  font-size: 11px;
  color: var(--ink-mute);
  margin-top: 3px;
  line-height: 1.35;
}
.prep-flag {
  display: inline-block;
  font-size: 9.5px;
  font-weight: 600;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  background: var(--amber-bg);
  color: var(--amber);
  padding: 2px 6px;
  border-radius: 4px;
  margin-left: 6px;
  vertical-align: middle;
}
.agenda-item.prep .agenda-topic::before {
  content: '';
  display: inline-block;
  width: 3px;
  height: 3px;
  background: var(--amber);
  border-radius: 50%;
  margin-right: 6px;
  vertical-align: middle;
  margin-bottom: 2px;
}

.timeline-item {
  display: flex;
  align-items: center;
  gap: 14px;
  padding: 14px 16px;
  background: var(--bg-card);
  border: 0.5px solid var(--line);
  border-radius: 12px;
  margin-bottom: 6px;
}
.timeline-date-block {
  font-family: 'Fraunces', serif;
  font-size: 18px;
  font-weight: 500;
  color: var(--ink);
  min-width: 56px;
  letter-spacing: -0.01em;
}
.timeline-label { font-size: 13px; color: var(--ink-soft); flex: 1; line-height: 1.3; }

/* Arbitrages panel */
.arb-card {
  background: var(--bg-card);
  border: 0.5px solid var(--line);
  border-left: 3px solid var(--amber);
  border-radius: 10px;
  padding: 12px 14px;
  margin-bottom: 8px;
}
.arb-stream-name {
  font-size: 10px;
  font-weight: 600;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--ink-mute);
  margin-bottom: 4px;
}
.arb-question {
  font-size: 14px;
  color: var(--ink);
  line-height: 1.45;
  font-weight: 500;
}

.empty {
  text-align: center;
  padding: 40px 20px;
  color: var(--ink-mute);
  font-size: 13px;
}
.footer-note {
  text-align: center;
  font-size: 10px;
  color: var(--ink-mute);
  padding: 24px 20px 8px;
  letter-spacing: 0.05em;
  text-transform: uppercase;
}
</style>
</head>

  return `
    <article class="card" data-card="${prefix}-${idx}">
      <header class="card-head" onclick="toggleCard('${prefix}-${idx}')">
        <span class="dot ${item.status}"></span>
        <span class="card-name">${item.name}</span>
        ${item.staffing ? `<span class="staffing">${item.staffing}</span>` : ''}
        ${hasBody ? '<span class="chevron"></span>' : ''}
      </header>
      ${nextMeeting ? `<div class="card-meta">Prochain : <span class="date">${nextMeeting.d}</span> · ${nextMeeting.t}</div>` : (item.nextSteps.length > 0 ? `<div class="card-meta">${item.nextSteps.length} next step${item.nextSteps.length > 1 ? 's' : ''} en cours</div>` : (item.arbitrage ? `<div class="card-meta" style="color: var(--amber); font-weight: 500;">Arbitrage en attente</div>` : ''))}
      ${hasBody ? `
        <div class="card-body">
          <div class="card-body-inner">
            ${item.nextSteps.length > 0 ? `
              <div class="block">
                <div class="block-label">Next steps</div>
                <ul class="list">
                  ${item.nextSteps.map(s => `<li>${s}</li>`).join('')}
                </ul>
              </div>
            ` : ''}
            ${item.meetings.length > 0 ? `
              <div class="block">
                <div class="block-label">Échéances</div>
                <ul class="list dates">
                  ${item.meetings.map(m => `<li><span class="date">${m.d}</span><span class="label">${m.t}</span></li>`).join('')}
                </ul>
              </div>
            ` : ''}
            ${item.arbitrage ? `
              <div class="block">
                <div class="block-label">Arbitrage JH</div>
                <div class="arb-inline">${item.arbitrage}</div>
              </div>
            ` : ''}
          </div>
        </div>
      ` : ''}
    </article>
  `;
}

function renderStreamsPanel() {
  const sorted = [...STREAMS].sort((a, b) => {
    const order = { red: 0, amber: 1, green: 2 };
    return order[a.status] - order[b.status];
  });
  const html = sorted.map((s, i) => renderCard(s, i, 'stream')).join('');
  document.getElementById('panel-streams').innerHTML = `
    <div class="section-head">
      <div class="section-title">Streams actifs</div>
      <div class="section-count">${STREAMS.length} streams · triés par statut</div>
    </div>
    ${html}
  `;
}

function renderPersonalPanel() {
  const html = PERSONAL.map((s, i) => renderCard(s, i, 'perso')).join('');
  document.getElementById('panel-personal').innerHTML = `
    <div class="section-head">
      <div class="section-title">Sujets personnels</div>
      <div class="section-count">Presse · Networking · Branding</div>
    </div>
    ${html}
  `;
}

function renderMeetingsPanel() {
  const meetingsHtml = GROUP_MEETINGS.map(m => `
    <div class="meeting-card featured">
      <div class="meeting-head">
        <div class="meeting-date-badge">${m.date}</div>
        <div class="meeting-title-text">${m.title}</div>
      </div>
      ${m.agenda.map(a => `
        <div class="agenda-item ${a.prep ? 'prep' : ''}">
          <div class="agenda-row">
            ${a.time ? `<div class="agenda-time">${a.time}</div>` : ''}
            <div class="agenda-body">
              <div class="agenda-topic">${a.topic}${a.prep ? '<span class="prep-flag">À préparer</span>' : ''}</div>
              ${a.owners ? `<div class="agenda-owners">${a.owners}</div>` : ''}
            </div>
          </div>
        </div>
      `).join('')}
    </div>
  `).join('');

  const committeesHtml = BRAND_COMMITTEES.map(b => `
    <div class="timeline-item">
      <div class="timeline-date-block">${b.d}</div>
      <div class="timeline-label">${b.t}</div>
    </div>
  `).join('');

  document.getElementById('panel-meetings').innerHTML = `
    <div class="section-head">
      <div class="section-title">Group meetings</div>
      <div class="section-count">Mai 2026</div>
    </div>
    ${meetingsHtml}
    <div class="section-head">
      <div class="section-title">Brand committees</div>
      <div class="section-count">Juin 2026</div>
    </div>
    ${committeesHtml}
  `;
}

function renderArbitragesPanel() {
  const all = [
    ...STREAMS.filter(s => s.arbitrage).map(s => ({ ...s, source: 'Stream équipe' })),
    ...PERSONAL.filter(s => s.arbitrage).map(s => ({ ...s, source: 'Sujet JH' }))
  ];
  document.getElementById('badge-arb').textContent = all.length;
  if (all.length === 0) {
    document.getElementById('panel-arbitrages').innerHTML = '<div class="empty">Aucun arbitrage en attente.</div>';
    return;
  }
  document.getElementById('panel-arbitrages').innerHTML = `
    <div class="section-head">
      <div class="section-title">En attente de décision</div>
      <div class="section-count">${all.length} arbitrage${all.length > 1 ? 's' : ''}</div>
    </div>
    ${all.map(s => `
      <div class="arb-card">
        <div class="arb-stream-name">${s.name} · ${s.source}</div>
        <div class="arb-question">${s.arbitrage}</div>
      </div>
    `).join('')}
  `;
}

function renderStats() {
  const total = STREAMS.length;
  const arbCount = STREAMS.filter(s => s.arbitrage).length + PERSONAL.filter(s => s.arbitrage).length;

  // Échéances dans les 7 jours (parsing des dates au format JJ/MM)
  const today = new Date(2026, 4, 11); // 11 mai 2026
  const in7days = new Date(2026, 4, 18);
  let deadlineCount = 0;
  [...STREAMS, ...PERSONAL].forEach(s => {
    s.meetings.forEach(m => {
      const match = m.d.match(/(\d{1,2})\/(\d{1,2})/);
      if (match) {
        const date = new Date(2026, parseInt(match[2]) - 1, parseInt(match[1]));
        if (date >= today && date <= in7days) deadlineCount++;
      }
    });
  });

  document.getElementById('stat-streams').textContent = total;
  document.getElementById('stat-deadlines').textContent = deadlineCount;
  document.getElementById('stat-arb').textContent = arbCount;
}

function toggleCard(id) {
  const card = document.querySelector(`[data-card="${id}"]`);
  if (card) card.classList.toggle('open');
}

document.querySelectorAll('.tab').forEach(tab => {
  tab.addEventListener('click', () => {
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
    tab.classList.add('active');
    document.getElementById('panel-' + tab.dataset.tab).classList.add('active');
    window.scrollTo({ top: 0, behavior: 'smooth' });
  });
});

renderStats();
renderStreamsPanel();
renderPersonalPanel();
renderMeetingsPanel();
renderArbitragesPanel();
</script>

</body>
</html>
